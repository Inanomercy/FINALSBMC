name: myapp
description: "OceanCart - Flutter E-Commerce Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.3

  # UI / Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Image Picker
  image_picker: ^1.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # URL Launcher (for map, Xendit checkout)
  url_launcher: ^6.3.1

  # HTTP client for Edge Function calls
  http: ^1.2.2

  # UUID generation
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.19.0

  # Local storage / caching
  shared_preferences: ^2.3.3

  # Carousel slider for banners
  carousel_slider: ^5.0.0

  # Smooth page indicator
  smooth_page_indicator: ^1.1.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  app_links: ^7.2.2

  # Flutter Launcher Icons (optional)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
